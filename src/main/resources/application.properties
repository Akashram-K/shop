spring.application.name=RoyaL Jwellery

# MySQL Database Configuration (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1155kashram}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Multipart Upload Limits & Storage Directory
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# Email / SMTP Configuration
